[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "georecvit"
version = "0.1.0"
description = "GeoRecViT: Heterogeneous Recursive ViT with SAM 3 and DINOv3-SAT for Remote Sensing Segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.49.0",
    "datasets>=2.20.0",
    "huggingface_hub>=0.24.0",
    "modelscope>=1.18.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "einops>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["georecvit*"]
