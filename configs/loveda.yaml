# LoveDA: Land-cOver Dataset with Drones and Aerial images (7 classes)
# Supervised SOTA: ~55.3-56.2% mIoU | SAM 3 OVSS (SegEarth-OV3): 47.4% mIoU
dataset:
  name: loveda
  source: local_loveda
  local_root: /content/georecvit_cache/datasets/loveda
  hf_repo: chloechia/loveda
  train_split: Train
  val_split: Val
  domains:
    - Urban
    - Rural
  image_column: image
  mask_column: label
  ignore_index: 255
  # Official LoveDA uses 0=no-data, 1..7=classes; "auto" maps to contiguous 0..6 + 255.
  label_mode: auto
  num_classes: 7
  class_names:
    - background
    - building
    - road
    - water
    - barren
    - forest
    - agricultural
  # Concise noun phrases aligned with SAM 3 PCS text encoder (context_length=32)
  class_prompts:
    - "background land and open ground"
    - "building roof and house"
    - "road and highway"
    - "water, river, pond and lake"
    - "barren land and bare soil"
    - "forest and trees"
    - "agricultural farmland and crop field"
  sam3_resolution: 1008
  dinov3_resolution: 512

model:
  sam3_repo: facebook/sam3
  dinov3_repo: facebook/dinov3-vitl16-pretrain-sat493m
  split_block_idx: 24
  num_recursive_rounds: 3
  sparse_top_windows: 3     # Out of 9 native 24x24 windows (33.3% late-ViT window compute)
  use_sam3_detr: true
  use_dinov3: true
  use_inner_link: true
  use_feedback_loop: true
  feedback_dim: 256

train_inner:
  epochs: 2
  batch_size: 2
  lr: 5.0e-4
  weight_decay: 0.01
  cos_weight: 1.0
  mse_weight: 0.1
  max_samples: 800

train_outer:
  epochs: 8
  batch_size: 1
  grad_accum_steps: 8
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  non_last_loss_weight: 0.2
  ce_weight: 1.0
  dice_weight: 1.0
  focal_weight: 0.5
  consistency_weight: 0.05
  precision: bf16
